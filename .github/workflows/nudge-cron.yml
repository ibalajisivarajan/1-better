name: Nudge Cron

on:
  # Schedule disabled until Supabase project and secrets are configured.
  # To re-enable: uncomment the schedule block below and push.
  #
  # schedule:
  #   - cron: '*/15 * * * *'
  #
  # Manual trigger only — useful for smoke-testing once secrets are set.
  workflow_dispatch:

jobs:
  send-nudges:
    name: Send push nudges
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Call send-nudges edge function
        env:
          SEND_NUDGES_URL: ${{ secrets.SEND_NUDGES_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Calling edge function at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/nudge-response.json \
            --write-out "%{http_code}" \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            -X POST \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${SEND_NUDGES_URL}")

          echo "HTTP status: ${HTTP_STATUS}"
          echo "Response body:"
          cat /tmp/nudge-response.json || true

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "ERROR: Edge function returned unexpected status ${HTTP_STATUS}"
            exit 1
          fi

          echo "Done."
